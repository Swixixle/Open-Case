[pytest]
# Collect only the real test suite. Without this, `pytest` from the repo root
# (what server/scripts/ci_pytest_floor.py and CI run) also tries to import the
# standalone debug script ./test_narrative.py — which calls sys.exit() at import
# and aborts collection with an INTERNALERROR — plus the gitignored nested
# Open-Case/ working copy. Scoping to tests/ keeps collection deterministic.
# (belt/tests/ are run separately via their own invocation.)
testpaths = tests
